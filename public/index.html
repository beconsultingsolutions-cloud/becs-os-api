/* ---------- 9d Tasks (the most used screen) ---------- */
const tasksScreen = {
  title: 'Tasks', status: 'open', tag: '', priority: '', project: '', q: '', quickVenture: '',
  async load() {
    const me = tasksScreen, v = ventureParam();
    const statuses = me.status === 'open' ? ['todo', 'doing'] : me.status === 'all' ? [null] : [me.status];
    const [lists, projects] = await Promise.all([
      Promise.all(statuses.map(s => needAll('/tasks', { ...v, status: s }))),
      maybeAll('/projects', v, 'projects:read')]);
    /* "Open" is two lists (to do + doing); remember if either was cut at the ceiling. */
    const tasks = lists.flat();
    if (lists.some(l => l.partial)) tasks.partial = true;
    return { tasks, projects };
  },
  draw(data) {
    const me = tasksScreen, writable = can('tasks:write'), t0 = today();
    const projName = id => data.projects ? ((data.projects.find(p => p.id === id) || {}).name || 'Project #' + id) : 'Project #' + id;
    const q = me.q.toLowerCase();
    const shown = data.tasks
      .filter(t => !me.tag || (me.tag === '_none' ? !t.filter_tag : t.filter_tag === me.tag))
      .filter(t => !me.priority || String(t.priority || 3) === me.priority)
      .filter(t => !me.project || (me.project === '_none' ? !t.project_id : String(t.project_id) === me.project))
      .filter(t => !q || [t.title, t.notes].some(x => x && String(x).toLowerCase().includes(q)));

    /* Sort: overdue first, then by due date (no date last), then priority. Done tasks go last, newest first. */
    const group = t => t.status === 'done' ? 4 : !t.due_date ? 3 : t.due_date < t0 ? 0 : t.due_date === t0 ? 1 : 2;
    shown.sort((a, b) => group(a) - group(b)
      || (group(a) === 4 ? String(b.completed_at || '').localeCompare(String(a.completed_at || '')) : 0)
      || String(a.due_date || '').localeCompare(String(b.due_date || ''))
      || (a.priority || 3) - (b.priority || 3)
      || (b.id - a.id));
    const GROUPS = [['overdue', 'Overdue'], ['today', 'Due today'], ['upcoming', 'Coming up'], ['nodate', 'No due date'], ['done', 'Done']];

    const row = t => {
      const late = group(t) === 0;
      return h('li', { class: 'trow' + (late ? ' is-late' : '') + (t.status === 'done' ? ' is-done' : '') },
        taskCheck(t),
        h('div', { class: 'tmain' },
          h('button', { class: 'linkbtn', type: 'button', 'data-fk': 't-' + t.id, onclick: () => taskForm(t) }, t.title),
          h('div', { class: 'tmeta' },
            ventTag(t.venture_id),
            t.project_id ? h('span', {}, projName(t.project_id)) : null,
            t.due_date ? h('span', { class: late ? 'late' : null }, t.status === 'done' ? 'Was due ' + fmtDate(t.due_date) : dueText(t.due_date)) : null,
            t.status === 'done' && t.completed_at ? h('span', {}, 'Done ' + timeAgo(t.completed_at)) : null),
          t.notes ? h('div', { class: 'snip' }, t.notes) : null),
        h('div', { class: 'tside' },
          late ? h('span', { class: 'pill late' }, 'Overdue') : null,
          h('span', { class: 'pill p' + (t.priority || 3) }, prioLabel(t.priority)),
          t.filter_tag ? h('span', { class: 'pill tag' }, labelOf(TAGS, t.filter_tag)) : null,
          inlineSelect(TASK_STATUSES, t.status, 'Status for ' + t.title, (val, el) => setTask(t, { status: val }, `Status set to ${labelOf(TASK_STATUSES, val)}.`, el), 'ts-' + t.id, writable)));
    };

    /* Filters */
    const sel = (label, value, options, onPick, fk) => {
      const s = h('select', { id: fk, 'data-fk': fk, value: String(value ?? '') }, options.map(([k, l]) => opt(k, l)));
      s.addEventListener('change', () => onPick(s.value));
      return h('div', { class: 'f' }, h('label', { for: fk }, label), s);
    };
    const statusSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by status' },
      [['open', 'Open'], ['todo', 'To do'], ['doing', 'Doing'], ['done', 'Done'], ['all', 'All']].map(([k, l]) =>
        h('button', { type: 'button', 'aria-pressed': String(me.status === k), 'data-fk': 'tf-' + k, onclick: () => { if (me.status !== k) { me.status = k; refresh(); } } }, l)));
    const projOptions = [['', 'All projects'], ['_none', 'No project']].concat((data.projects || []).slice().sort(byName).map(p => [p.id, p.name]));
    const search = h('input', { id: 'task-search', type: 'search', placeholder: 'Title or notes\u2026', value: me.q, 'data-fk': 'task-search' });
    search.addEventListener('input', () => { me.q = search.value; redraw(); });
    const anyFilter = me.tag || me.priority || me.project || me.q;

    /* Quick add: type a title, press Enter. Uses the current filters as defaults
       so the new task shows up in the list you are looking at. */
    const qInput = h('input', { type: 'text', placeholder: 'Add a task and press Enter', 'aria-label': 'New task title', maxlength: 300, 'data-fk': 'quick-add' });
    const needVenturePick = !selectedVenture() && !(me.project && me.project !== '_none') && VENTURES.length;
    const qVenture = needVenturePick ? h('select', { 'aria-label': 'Venture for the new task', 'data-fk': 'quick-venture' },
      VENTURES.filter(x => x.status !== 'archived').map(x => opt(x.id, x.name))) : null;
    if (qVenture) qVenture.value = String(me.quickVenture || defaultVenture());
    const qBtn = h('button', { class: 'btn', type: 'submit' }, icon('plus'), 'Add');
    const quick = h('form', { class: 'quickadd', 'aria-label': 'Quick add task' }, qInput, qVenture, qBtn);
    quick.addEventListener('submit', async ev => {
      ev.preventDefault();
      const title = qInput.value.trim();
      if (!title) { qInput.focus(); return; }
      if (qBtn.disabled) return;
      const proj = me.project && me.project !== '_none' && data.projects ? data.projects.find(p => String(p.id) === me.project) : null;
      const venture_id = proj ? proj.venture_id : Number(selectedVenture() || (qVenture && qVenture.value) || defaultVenture());
      if (!venture_id) { toast('Pick a venture first (top of the page).', true); return; }
      const body = { title, venture_id };
      if (proj) body.project_id = proj.id;
      if (me.priority) body.priority = Number(me.priority);
      if (me.tag && me.tag !== '_none') body.filter_tag = me.tag;
      if (me.status === 'doing' || me.status === 'done') body.status = me.status;
      if (qVenture) me.quickVenture = qVenture.value;
      storeSet('local', STORE_LAST_VENTURE, String(venture_id));
      qInput.disabled = true; qBtn.disabled = true;
      try {
        await write('POST', '/tasks', body, 'Task added.');
        if (qInput.isConnected) qInput.value = '';            // list could not refresh: still clear the box
      } catch { /* message already shown; the typed title is kept */ }
      if (qInput.isConnected) { qInput.disabled = false; qBtn.disabled = false; }
      const box = document.querySelector('#app [data-fk="quick-add"]');
      if (box) box.focus();
    });

    const groups = GROUPS.map(([k, l], gi) => {
      const items = shown.filter(t => group(t) === gi);
      return items.length ? h('section', { class: 'tgroup' + (k === 'overdue' ? ' overdue' : ''), 'aria-label': l },
        h('h2', {}, `${l} \u00b7 ${items.length}`), h('ul', { class: 'tlist' }, items.map(row))) : null;
    });

    return [
      shead('BECS OS \u00b7 Tasks \u00b7 ' + scopeLabel(), 'Tasks', 'Overdue first, then by due date and priority. Tick the box when it is done.',
        writable ? h('button', { class: 'btn primary', type: 'button', onclick: () => taskForm(null, { project_id: me.project && me.project !== '_none' ? Number(me.project) : undefined, venture_id: (data.projects || []).find(p => String(p.id) === me.project)?.venture_id }) }, icon('plus'), 'Add task') : null),
      partialNotice([['tasks', data.tasks], ['projects', data.projects]]),
      writable ? quick : null,
      h('div', { class: 'filters' },
        h('div', { class: 'f wide' }, h('span', {}, 'Status'), statusSeg),
        sel('Why it matters', me.tag, [['', 'All tags'], ...TAGS, ['_none', 'No tag']], v => { me.tag = v; redraw(); }, 'f-tag'),
        sel('Priority', me.priority, [['', 'All'], ...PRIORITIES], v => { me.priority = v; redraw(); }, 'f-prio'),
        data.projects ? sel('Project', me.project, projOptions, v => { me.project = v; redraw(); }, 'f-proj') : null,
        h('div', { class: 'f' }, h('label', { for: 'task-search' }, 'Search'), search),
        anyFilter ? h('button', { class: 'btn sm', type: 'button', style: 'margin-bottom:2px', onclick: () => { me.tag = me.priority = me.project = me.q = ''; redraw(); } }, 'Clear filters') : null),
      shown.length ? groups
        : h('div', { class: 'panel empty' }, h('b', {}, data.tasks.length ? 'No tasks match these filters.' : (me.status === 'open' ? 'No open tasks.' : 'No tasks here.')),
            data.tasks.length ? 'Clear a filter to see more.' : 'Type a title above and press Enter to add one.')
    ];
  }
};

/* ---------- 9e Keys (owner only) ---------- */
const keysScreen = {
  title: 'Keys',
  async load() { return { keys: (await need('/admin/keys')) || [] }; },
  draw({ keys }) {
    const apps = new Map();
    for (const k of keys) {
      const a = apps.get(k.app) || { app: k.app, scopes: new Set(), count: 0, created: [] };
      (k.scopes || []).forEach(s => a.scopes.add(s)); a.count++; a.created.push(k.created_at);
      apps.set(k.app, a);
    }
    const list = [...apps.values()].sort((a, b) => String(a.app).localeCompare(String(b.app)));
    const revoke = async (a, btn) => {
      const yes = await confirmBox({ title: 'Revoke access?', ok: 'Revoke', body: `Every key issued to "${a.app}" (${a.count}) stops working immediately. Anything using it will get "unauthorized" until you give it a new key.` });
      if (!yes) return;
      quiet(write('DELETE', `/admin/keys/${encodeURIComponent(a.app)}`, undefined, `Keys for ${a.app} revoked.`, btn));
    };
    return [
      shead('BECS OS \u00b7 Keys', 'App keys', 'Give each app or AI assistant its own key with only the rights it needs. Revoke a key here when an app should stop.',
        h('button', { class: 'btn primary', type: 'button', onclick: newKeyForm }, icon('plus'), 'Create key')),
      h('div', { class: 'panel' }, list.length
        ? h('table', { class: 'tbl' },
            h('thead', {}, h('tr', {}, ['App', 'What it can do', 'Created', ''].map(x => h('th', { scope: 'col' }, x || h('span', { class: 'sr' }, 'Actions'))))),
            h('tbody', {}, list.map(a => h('tr', {},
              h('td', {}, h('div', { class: 'name nowrap' }, a.app), a.count > 1 ? h('div', { class: 'meta' }, a.count + ' keys') : null),
              h('td', { 'data-label': 'Scopes' }, h('div', { class: 'tmeta' }, [...a.scopes].sort().map(s => h('span', { class: 'pill scope' + (s.endsWith(':write') ? ' p2' : '') }, s)))),
              h('td', { 'data-label': 'Created', class: 'mono nowrap' }, a.created.filter(Boolean).length ? a.created.filter(Boolean).map(t => h('div', {}, fmtTs(t))) : '\u2014'),
              h('td', { class: 'r' }, h('div', { class: 'cell-actions' }, h('button', { class: 'btn sm danger', type: 'button', 'data-fk': 'rv-' + a.app, onclick: e => revoke(a, e.currentTarget) }, 'Revoke')))))))
        : h('div', { class: 'empty' }, h('b', {}, 'No app keys yet.'), 'Create one for each app that should read or write BECS OS.'))
    ];
  }
};

function newKeyForm() {
  const dlg = $('#dlg');
  const app = h('input', { id: 'k-app', type: 'text', maxlength: 100, autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'k-app-hint k-app-err' });
  const appErr = h('span', { class: 'ferr', id: 'k-app-err' });
  const general = h('div', { class: 'derr', role: 'alert' });
  const boxes = {};
  const box = (scope, text) => { boxes[scope] = h('input', { type: 'checkbox', value: scope }); return h('label', {}, boxes[scope], h('span', {}, text)); };
  const grid = h('div', { class: 'scopes', role: 'group', 'aria-label': 'What this key may do' },
    h('div', { class: 'hd' }, 'Area'), h('div', { class: 'hd' }, 'Read'), h('div', { class: 'hd' }, 'Write'),
    SCOPE_TABLES.flatMap(([t, l, r, w]) => [
      h('div', {}, h('div', {}, h('b', {}, l), h('div', { class: 'desc' }, r + '. Write: ' + w.toLowerCase() + '.'))),
      h('div', {}, box(t + ':read', 'Read')), h('div', {}, box(t + ':write', 'Write'))]),
    h('div', { class: 'last' }, h('div', {}, h('b', {}, 'Activity log'), h('div', { class: 'desc' }, 'See who changed what, and when.'))),
    h('div', { class: 'last' }, box('activity:read', 'Read')), h('div', { class: 'last' }));
  const preset = list => () => { for (const [s, b] of Object.entries(boxes)) b.checked = list.includes(s); };
  const presets = h('div', { class: 'actions' },
    h('button', { class: 'btn sm', type: 'button', onclick: preset(ALL_READ) }, 'Read everything'),
    h('button', { class: 'btn sm', type: 'button', onclick: preset(ALL_SCOPES) }, 'Read and write everything'),
    h('button', { class: 'btn sm', type: 'button', onclick: preset(['tasks:read', 'tasks:write', 'projects:read', 'ventures:read']) }, 'Tasks only'),
    h('button', { class: 'btn sm', type: 'button', onclick: preset([]) }, 'Clear'));
  const save = h('button', { class: 'btn primary', type: 'submit' }, 'Create key');
  const form = h('form', { class: 'dform', novalidate: true },
    h('div', {}, h('div', { class: 'eyebrow' }, 'New app key'), h('h2', { class: 'h2', id: 'dlgTitle', style: 'margin-top:4px' }, 'Create key'), h('div', { class: 'lime-rule' })),
    h('div', { class: 'field' }, h('div', { class: 'lbl' }, h('label', { for: 'k-app' }, 'App name'), h('span', { class: 'req', 'aria-hidden': 'true' }, '*')), app,
      h('span', { class: 'hint', id: 'k-app-hint' }, 'Short lowercase name, e.g. leaa-portal. Using a name that already exists adds another key for that app.'), appErr),
    h('div', { class: 'field' }, h('span', { style: 'font-weight:700;font-size:.875rem' }, 'What it may do'), presets, grid),
    general,
    h('div', { class: 'dfoot' }, h('div', { class: 'right' }, h('button', { class: 'btn', type: 'button', onclick: () => dlg.close() }, 'Cancel'), save)));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (save.disabled) return;
    appErr.textContent = ''; general.textContent = ''; app.removeAttribute('aria-invalid');
    const name = app.value.trim();
    const scopes = Object.values(boxes).filter(b => b.checked).map(b => b.value);
    if (!name) { appErr.textContent = 'Required.'; app.setAttribute('aria-invalid', 'true'); app.focus(); return; }
    if (!scopes.length) { general.textContent = 'Tick at least one box, or use a preset.'; return; }
    save.disabled = true; save.textContent = 'Creating\u2026';
    try {
      const out = await api('POST', '/admin/keys', { app: name, scopes });
      showNewKey(out, name);
      quiet(refresh());
    } catch (e) {
      if (e.status === 401) return;
      if (e.fields && e.fields.app) { appErr.textContent = String(e.fields.app); app.setAttribute('aria-invalid', 'true'); }
      general.textContent = e.message + (e.fields ? ' ' + Object.entries(e.fields).filter(([k]) => k !== 'app').map(([k, v]) => `${k}: ${v}`).join(' ') : '');
      save.disabled = false; save.textContent = 'Create key';
    }
  });
  dlg.replaceChildren(form);
  openModal(dlg, app);
}

/* Show the raw key exactly once. It is only in this dialog; closing it removes it from the page. */
function showNewKey(out, appName) {
  const dlg = $('#dlg');
  const raw = out && typeof out === 'object' ? (out.key || out.raw_key || out.token || '') : (typeof out === 'string' ? out : '');
  const field = h('input', { id: 'k-raw', type: 'text', readOnly: true, value: raw, 'aria-describedby': 'k-warn', spellcheck: 'false' });
  const copied = h('span', { class: 'hint', role: 'status' });
  const copy = h('button', { class: 'btn solid', type: 'button', onclick: async () => {
    field.select();
    try { await navigator.clipboard.writeText(raw); copied.textContent = 'Copied to the clipboard.'; }
    catch { copied.textContent = 'Press Ctrl+C (or long-press and Copy) to copy the selected key.'; }
  } }, icon('copy'), 'Copy');
  const done = h('button', { class: 'btn primary', type: 'button', onclick: () => dlg.close() }, 'I have saved it');
  dlg.replaceChildren(h('div', { class: 'dform' },
    h('div', {}, h('div', { class: 'eyebrow' }, 'Key created for ' + appName), h('h2', { class: 'h2', id: 'dlgTitle', style: 'margin-top:4px' }, 'Copy this key now'), h('div', { class: 'lime-rule' })),
    h('p', { class: 'warn', id: 'k-warn' }, 'This is the only time the key is shown. It cannot be shown again. If you lose it, revoke the app and create a new key.'),
    raw ? h('div', { class: 'field' }, h('label', { for: 'k-raw' }, 'Key'), h('div', { class: 'keybox' }, field, copy), copied)
        : h('p', { class: 'derr' }, 'The server did not return the key text. Revoke this app and try again.'),
    h('p', { class: 'small muted' }, 'Give it to the app as a header: Authorization: Bearer <key>. Never paste it into a web page or a shared document.'),
    h('div', { class: 'dfoot' }, h('div', { class: 'right' }, done))));
  dlg.addEventListener('close', () => { if (field.isConnected) field.value = ''; dlg.replaceChildren(); }, { once: true });
  (raw ? copy : done).focus();
  if (raw) field.select();
}

/* =====================================================================
   10  ROUTER AND START-UP
   ===================================================================== */
const SCREENS = { overview, clients: clientsScreen, projects: projectsScreen, tasks: tasksScreen, keys: keysScreen };
let renderToken = 0, current = null, cache = null;
const routeName = () => { const r = location.hash.replace(/^#\/?/, ''); return SCREENS[r] && (r !== 'keys' || isAdmin()) ? r : 'overview'; };

/* Full load of the current screen (on navigation or venture change). */
async function route() {
  if (!SESSION.me) return;
  const name = routeName(), screen = SCREENS[name];
  if (`#/${name}` !== location.hash) history.replaceState(null, '', `#/${name}`);

  } catch (e) {

    const scope = { clients: 'clients:read', projects: 'projects:read', tasks: 'tasks:read' }[name];

}
/* Re-fetch the current screen after a write; keeps scroll position and focus. */

/* Phones: tell the CSS how much of the screen is visible (it shrinks when the
