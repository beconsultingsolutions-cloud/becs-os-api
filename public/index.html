<!--
=====================================================================
BECS OS CONSOLE  -  how this file is organised
---------------------------------------------------------------------
One file, no build step, no outside scripts. Open it in any editor.

  1. <style>        Fonts (self-hosted in /fonts), BECS brand tokens,
                    then components: buttons, cards, pills, tables,
                    task list, P.E.S. strip, dialogs, mobile layout.
  2. <body>         Static skeleton only: the sign-in "gate", the app
                    shell (navy rail + top bar + <main>), two dialogs,
                    the toast, and an SVG icon sprite.
  3. <script>       Numbered sections, top to bottom:
       1  Settings and the allowed values (enums) from docs/SPEC.md
       2  Helpers: building page elements safely, dates, money
       3  API layer: every request to /api goes through api()
       4  Sign-in: /api/me, key box, lock / sign out
       5  Ventures and the venture switcher
       6  Shared pieces: toast, confirm box, error panels
       7  The form dialog used for every create / edit
       8  Record forms: client, project, task
       9  Screens: Overview, Clients, Projects, Tasks, Keys
      10  Router and start-up

Contract : docs/SPEC.md is the source of truth for paths, fields and
           enums. If the API changes, change section 1 and the forms.
Safety   : Page content is built with h() (section 2), which only ever
           sets text, never HTML. Do not use innerHTML with API data:
           notes are written by apps and AI agents and must stay text.
Auth     : Cloudflare Access cookie first; otherwise a key typed into
           the key box, kept in sessionStorage for this tab only.
           No key is ever written into this file.
=====================================================================
-->

<style>
/* ---------- 1a. Fonts (self-hosted, latin subset, see fonts/OFL.txt) ---------- */
@font-face{font-family:"Bebas Neue";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}

/* ---------- 1b. BECS tokens. Do not introduce new brand colors. ---------- */
:root{
  --cream:#F4F7E9;       /* Pale Cream: page base */
  --cream-2:#E9EED7;     /* darker cream for tracks and columns */
  --purple:#2B287E;      /* BE Purple: headings, primary ink */
  --navy:#2D2A5F;        /* Midnight Navy: rail, borders, body ink */
  --lime:#8DC63F;        /* Lime Green: accent (backgrounds only, never small text on cream) */
  --lavender:#9B98D8;
  --slate:#9BA9B6;
  --indigo-soft:#3B3A8C;
  --ink:#2D2A5F;
  --ink-soft:#55537F;    /* secondary text, 6:1 on cream */
  --line:#CFD6B8;        /* hairlines inside cards */
  --card:#FDFEF8;
  --danger:#B3261E;      /* overdue, delete, errors */
  --danger-tint:#B3261E14;
  --lime-tint:#8DC63F40;
  --purple-tint:#2B287E14;
  --radius:10px;
  --display:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,select:disabled,input:disabled{cursor:not-allowed;opacity:.6}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.rail :focus-visible,.deep :focus-visible{outline-color:var(--lime)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}
.eyebrow.lime{color:var(--lime)}
.h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,6vw,3.6rem);line-height:.95;letter-spacing:.02em;color:var(--purple);text-transform:uppercase}
.h2{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.05;letter-spacing:.03em;color:var(--navy);text-transform:uppercase}
.h3{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.1;letter-spacing:.03em;color:var(--navy);text-transform:uppercase;overflow-wrap:anywhere}
.lime-rule{width:3rem;height:4px;background:var(--lime);margin-top:.6rem}
.muted{color:var(--ink-soft)}
.mono{font-family:var(--mono);font-size:.78rem}
.small{font-size:.875rem}
.late{color:var(--danger);font-weight:700}

/* ---------- 1c. Shell: navy rail + content column ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--navy) 232px,transparent 232px)}   /* rail colour runs the full page height */
.rail{background:var(--navy);color:var(--cream);padding:24px 14px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:inherit;text-decoration:none}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;color:#C9C8E6;letter-spacing:.06em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:8px;color:#DCDCF0;text-decoration:none;font-weight:500;border-left:4px solid transparent}
.nav a:hover{background:rgba(244,247,233,.09);color:#fff}
.nav a[aria-current="page"]{background:rgba(244,247,233,.13);color:#fff;border-left-color:var(--lime)}
.rail-foot{margin-top:auto;font-family:var(--mono);font-size:11px;color:#C9C8E6;padding:0 8px;line-height:1.6}
.rail-foot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:6px}

.col-main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px clamp(16px,4vw,48px);border-bottom:2px solid var(--navy);background:var(--cream);position:sticky;top:0;z-index:15}
.vpick{display:flex;align-items:center;gap:10px;min-width:0}
.vpick label{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.vpick select{min-width:0;max-width:62vw;font-weight:700}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .id{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
main{padding:32px clamp(16px,4vw,48px) 80px;max-width:1240px;width:100%}
main:focus{outline:none}

/* ---------- section head (eyebrow, title, lime rule, intro) ---------- */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.shead .intro{margin-top:10px;max-width:56ch;color:var(--ink-soft)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- 1d. Buttons. Only one .primary per screen. ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--navy);background:transparent;color:var(--navy);padding:8px 16px;border-radius:8px;font-weight:700;min-height:44px;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--cream-2)}
.btn.primary{background:var(--lime);color:var(--navy);box-shadow:4px 4px 0 var(--navy);transition:transform .08s,box-shadow .08s}
.btn.primary:hover:not(:disabled){background:var(--lime);transform:translate(1px,1px);box-shadow:3px 3px 0 var(--navy)}
.btn.primary:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--navy)}
.btn.solid{background:var(--navy);color:var(--cream)}
.btn.solid:hover:not(:disabled){background:var(--purple)}
.btn.light{border-color:var(--cream);color:var(--cream)}
.btn.light:hover:not(:disabled){background:rgba(244,247,233,.12)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover:not(:disabled){background:var(--danger-tint)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.875rem}
.btn.icon{padding:0;width:44px}
.btn.sm.icon{width:36px}
.linkbtn{background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.linkbtn:hover{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--lime)}
@media (pointer:coarse){.btn.sm{min-height:44px}.btn.sm.icon{width:44px}}

/* ---------- inputs ---------- */
input,select,textarea{border:2px solid var(--navy);background:#fff;border-radius:8px;padding:8px 12px;min-height:44px;width:100%;font-size:1rem}
textarea{min-height:110px;resize:vertical;line-height:1.45}
select.inline{width:auto;min-height:36px;padding:4px 30px 4px 10px;font-size:.85rem;font-weight:500}
@media (pointer:coarse){select.inline{min-height:44px}}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger);background:#FFF7F6}

/* ---------- cards, panels ---------- */
.panel{background:var(--card);border:2px solid var(--navy);border-radius:var(--radius)}
.panel.pad{padding:20px}
.block{margin-bottom:36px}
.block>.h2{margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block>.h2 .mono{color:var(--ink-soft);letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.empty{padding:24px 20px;color:var(--ink-soft)}
.empty b{display:block;color:var(--navy);margin-bottom:4px}
.notice{border:2px solid var(--navy);border-left-width:8px;border-radius:var(--radius);background:var(--card);padding:16px 18px;margin-bottom:24px}
.notice.err{border-color:var(--danger)}
.notice b{display:block;margin-bottom:4px}
.notice .actions{margin-top:12px}
.loading{padding:28px 20px;font-family:var(--mono);font-size:.85rem;color:var(--ink-soft)}

/* ---------- Overview: deep masthead + stat rail ---------- */
.deep{background:linear-gradient(155deg,var(--purple),var(--navy) 62%,#211F4A);color:#fff;border-radius:14px;padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.deep .h1{color:#fff;font-size:clamp(2.3rem,6vw,3.75rem)}
.deep p{color:rgba(255,255,255,.78);max-width:36rem;margin-top:10px}
.deep .btn.primary{box-shadow:4px 4px 0 #12112E}   /* navy shadow would vanish on the navy masthead */
.deep .btn.primary:hover:not(:disabled){box-shadow:3px 3px 0 #12112E}
.deep .pes{font-family:var(--mono);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--lavender);margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:2px solid var(--navy);border-radius:var(--radius);background:var(--card);overflow:hidden;margin-bottom:36px}
.stat{padding:16px 20px;border-right:2px solid var(--navy);min-width:0}
.stat:last-child{border-right:0}
.stat .n{display:block;font-family:var(--display);font-size:52px;line-height:1;color:var(--purple);overflow-wrap:anywhere}
.stat .l{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.stat .s{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);display:block;margin-top:2px}
.stat.alert .n{color:var(--danger)}
.stat.alert{background:var(--danger-tint)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat{border-right:0;border-bottom:2px solid var(--navy)}.stat:nth-child(odd){border-right:2px solid var(--navy)}.stat:nth-last-child(-n+2):nth-child(odd),.stat:last-child{border-bottom:0}.stat:last-child:nth-child(odd){grid-column:1/-1;border-right:0}.stat .n{font-size:42px}}
@media (prefers-reduced-motion:no-preference){@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}.stats.anim{animation:wipe .55s ease-out both}}

/* bar list: client pipeline, tasks by venture */
.bars{list-style:none;padding:6px 0}
.bars a{display:grid;grid-template-columns:minmax(90px,11rem) minmax(0,1fr) 3ch;align-items:center;gap:12px;padding:6px 18px;min-height:40px;color:inherit;text-decoration:none}
.bars a:hover{background:var(--cream-2)}
.bars .lbl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;background:var(--cream-2);border:2px solid var(--navy);border-radius:99px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--lime)}
.bars .num{font-family:var(--mono);font-size:.85rem;text-align:right}

/* simple rows (activity feed, dashboard lists) */
.rows{list-style:none;padding:0}
.rows>li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.rows>li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.meta{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);overflow-wrap:anywhere}
/* "Showing the 25 oldest of 31" under a dashboard list that was cut short */
.more{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:10px 16px;border-top:2px solid var(--navy);background:var(--cream-2);font-size:.875rem;font-weight:500;border-radius:0 0 8px 8px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1.5px solid var(--slate);color:var(--ink-soft);background:transparent;white-space:nowrap;line-height:1.5}
.pill.p1,.pill.late{border-color:var(--danger);color:var(--danger);background:var(--danger-tint)}
.pill.p2,.pill.doing,.pill.contacted,.pill.proposal,.pill.planning{border-color:var(--purple);color:var(--purple);background:var(--purple-tint)}
.pill.done,.pill.active{border-color:var(--navy);color:var(--navy);background:var(--lime-tint)}
.pill.tag{border-color:var(--navy);color:var(--navy);background:var(--cream-2)}
.pill.vent{border-color:var(--navy);color:var(--cream);background:var(--navy)}
.pill.scope{text-transform:none;letter-spacing:0}

/* ---------- filters bar ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:18px}
.filters .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.filters .f>span,.filters .f>label{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.filters select,.filters input{width:auto;min-width:8.5rem;max-width:100%;min-height:40px;padding:6px 10px;font-size:.92rem}
.filters input[type="search"]{min-width:12rem}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--navy);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-right:2px solid var(--navy);background:transparent;padding:6px 12px;min-height:40px;font-weight:700;font-size:.875rem}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.seg button:hover:not([aria-pressed="true"]){background:var(--cream-2)}
.seg .c{font-family:var(--mono);font-weight:400;font-size:.72rem;margin-left:5px;opacity:.85}
@media (max-width:760px){
  .filters .f{flex:1 1 9rem}
  .filters .f.wide{flex-basis:100%}
  .filters select,.filters input,.filters input[type="search"]{width:100%;min-width:0}
  /* segmented filters stay on one row and scroll sideways inside themselves */
  .seg{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:thin}
  .seg button{flex:1 0 auto;min-height:44px}
}

/* ---------- tables (clients, keys): stack into cards on phones ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--ink-soft);padding:12px 16px;border-bottom:2px solid var(--navy)}
.tbl td{padding:12px 16px;border-bottom:1.5px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right}
.tbl .name{font-weight:700;overflow-wrap:anywhere}
.cell-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap}
.stage-cell{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbl .nowrap{white-space:nowrap;overflow-wrap:normal}
.tbl td.contact{min-width:12rem;max-width:16rem}
.tbl td.contact a{color:inherit;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snip{color:var(--ink-soft);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:12px 14px;border-bottom:1.5px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:4px 0}
  .tbl td[data-label]::before{content:attr(data-label);display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .tbl td.r{text-align:left}
  .cell-actions{justify-content:flex-start;flex-wrap:wrap;padding-top:6px}
  .tbl td.contact{max-width:none}
  .tbl td.contact.none{display:none}
  .tbl td.count::before{display:inline!important;margin-right:8px}
}

/* ---------- Tasks list ---------- */
.quickadd{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:12px;border:2px solid var(--navy);border-radius:var(--radius);background:var(--card)}
.quickadd input{flex:1 1 16rem;min-width:0}
.quickadd select{width:auto;flex:0 0 auto;max-width:100%}   /* as wide as its longest venture name */
.tgroup{margin-bottom:22px}
.tgroup>h2{font-family:var(--mono);font-size:.78rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px 2px}
.tgroup.overdue>h2{color:var(--danger)}
.tlist{list-style:none;padding:0;background:var(--card);border:2px solid var(--navy);border-radius:var(--radius);overflow:hidden}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.is-late{box-shadow:inset 6px 0 0 var(--danger)}
.check{flex:none;width:44px;height:44px;margin:-4px 0;border:2px solid var(--navy);border-radius:10px;background:#fff;display:grid;place-items:center;color:transparent}
.check:hover:not(:disabled){background:var(--lime-tint);color:var(--navy)}
.check[aria-pressed="true"]{background:var(--lime);color:var(--navy)}
.check .ico{width:22px;height:22px;stroke-width:3}
.tmain{flex:1;min-width:0;padding-top:4px}
.tmain .linkbtn{font-size:1rem;line-height:1.35}
.trow.is-done .tmain .linkbtn{text-decoration:line-through;color:var(--ink-soft)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;font-family:var(--mono);font-size:.75rem;color:var(--ink-soft)}
.tmeta>span:not(.pill)+span:not(.pill)::before{content:'·';margin-right:10px}   /* 'Brand refresh · Due tomorrow' */
.tside{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:45%}
@media (max-width:760px){.trow{flex-wrap:wrap}.tside{max-width:none;width:100%;justify-content:flex-start;padding-left:56px}}

/* ---------- Projects: cards + P.E.S. phase strip ---------- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.pcard{background:var(--card);border:2px solid var(--navy);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .kv{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.76rem;color:var(--ink-soft);flex-wrap:wrap}
.pcard .kv b{color:var(--navy);font-weight:500}
.pcard .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1.5px solid var(--line);padding-top:12px;margin-top:auto}
.bar{height:10px;background:var(--cream-2);border:1.5px solid var(--navy);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime)}
.phase{display:flex;border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.phase button,.phase span{flex:1;border:0;border-right:2px solid var(--navy);background:transparent;padding:6px;font-family:var(--display);font-size:1.2rem;letter-spacing:.06em;color:var(--ink-soft);min-height:44px;display:grid;place-items:center}
.phase>:last-child{border-right:0}
.phase button:hover:not(.on){background:var(--cream-2)}
.phase .past{background:var(--lime);color:var(--navy)}
.phase .on{background:var(--navy);color:var(--cream)}

/* ---------- Keys ---------- */
.scopes{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0;border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.scopes>div{padding:8px 12px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:8px;min-width:0}
.scopes>div.hd{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--navy)}
.scopes>div.last{border-bottom:0}
.scopes label{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:.85rem}
.scopes input[type="checkbox"]{width:22px;height:22px;min-height:0;accent-color:var(--purple);flex:none}
.scopes .desc{font-size:.8rem;color:var(--ink-soft)}
.keybox{display:flex;gap:8px;flex-wrap:wrap}
.keybox input{flex:1 1 14rem;font-family:var(--mono);font-size:.85rem;background:var(--cream-2)}
.warn{border:2px solid var(--danger);background:var(--danger-tint);border-radius:8px;padding:10px 12px;color:var(--danger);font-weight:700;font-size:.9rem}

/* ---------- 1e. Dialogs ---------- */
/* The dialog itself scrolls; its action row (.dfoot) is pinned to the bottom of
   it, so Save is always on screen however long the form is. scroll-padding keeps
   a focused field from hiding behind that pinned row. */
dialog{margin:auto;border:2px solid var(--navy);border-radius:var(--radius);padding:0;background:var(--cream);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:8px 8px 0 var(--navy);overflow-y:auto;overscroll-behavior:contain;scroll-padding-bottom:96px}
dialog::backdrop{background:rgba(45,42,95,.55)}
.dform{padding:22px 22px 8px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead .h2{font-size:2rem;color:var(--purple)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field .lbl{font-weight:700;font-size:.875rem}
.field .lbl{display:flex;gap:4px}
.field .req{color:var(--danger)}
.field .hint{font-size:.78rem;color:var(--ink-soft)}
.field .ferr{font-size:.82rem;color:var(--danger);font-weight:700}
.field .ferr:empty{display:none}
.derr{color:var(--danger);font-weight:700;font-size:.9rem}
.derr:empty{display:none}
.dfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:2px solid var(--navy);padding:14px 0 max(14px,env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:1;background:var(--cream)}
.dfoot .right{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stamp{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);max-width:calc(100vw - 32px);background:var(--navy);color:var(--cream);padding:11px 18px;border-radius:8px;border-left:6px solid var(--lime);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{border-left-color:#FF8A80}

/* ---------- sign-in gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 10%,#fff 0,var(--cream) 55%)}
.gate .panel{width:min(440px,100%);padding:28px;box-shadow:8px 8px 0 var(--navy)}
.gate .brandrow{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.gate form{display:flex;flex-direction:column;gap:12px;margin-top:18px}

/* ---------- 1f. Phones: rail becomes a bottom bar ---------- */
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);background:none}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30;gap:0;border-top:3px solid var(--lime)}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around;gap:2px}
  .nav a{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;font-size:.68rem;padding:6px 2px;border-left:0;border-top:3px solid transparent;border-radius:6px;justify-content:center;text-align:center}
  .nav a[aria-current="page"]{border-top-color:var(--lime)}
  .topbar{padding:8px 16px;flex-wrap:nowrap}
  .vpick{flex:1}
  .vpick label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .vpick select{width:100%;max-width:none}
  .who .id{display:none}
  main{padding:20px 16px 110px}
  .deep{padding:22px 18px}
  #toast{bottom:90px}
  /* Dialogs sit in the middle of the part of the screen you can actually see
     (--vv-top / --vv-h are set from window.visualViewport in section 10), so
     when the on-screen keyboard opens the dialog shrinks above it and its
     pinned Save row stays visible. Falls back to the full screen height. */
  dialog{margin:0 auto;top:calc(var(--vv-top,0px) + var(--vv-h,100dvh) / 2);bottom:auto;transform:translateY(-50%);
    max-height:calc(var(--vv-h,100dvh) - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  .dform{padding:18px 16px 4px}
  /* Delete, Cancel and Save on one row, so the pinned row stays short. */
  .dfoot,.dfoot .right{flex-wrap:nowrap}
  .dfoot .btn{padding-left:12px;padding-right:12px}
  /* Quick add: the title gets its own row next to Add, the venture picker a full row below, so long names fit. */
  .quickadd input{flex:1 1 0}
  .quickadd .btn{order:2}
  .quickadd select{order:3;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<script>
'use strict';

/* =====================================================================
   1  SETTINGS AND ALLOWED VALUES (mirror docs/SPEC.md)
   ===================================================================== */
const API_BASE = '/api';                       // the Worker answers everything under /api
const STORE_KEY = 'becs.key';                  // sessionStorage: key typed into the key box (this tab only)
const STORE_VENTURE = 'becs.venture';          // localStorage: venture switcher choice ('' = all)
const STORE_LAST_VENTURE = 'becs.lastVenture'; // localStorage: last venture used in a form
const LIST_PAGE = 500;                         // the API's maximum page size: lists are read 500 rows at a time
const LIST_CEILING = 5000;                     // most rows the console loads for one list (a notice says so if there are more)

const STAGES = [['lead', 'Lead'], ['contacted', 'Contacted'], ['proposal', 'Proposal'], ['active', 'Active'], ['paused', 'Paused'], ['closed', 'Closed']];
const PROJECT_STATUSES = [['planning', 'Planning'], ['active', 'Active'], ['paused', 'Paused'], ['done', 'Done'], ['cancelled', 'Cancelled']];
const TASK_STATUSES = [['todo', 'To do'], ['doing', 'Doing'], ['done', 'Done']];
const PRIORITIES = [[1, 'High'], [2, 'Med'], [3, 'Low']];      // integer in the API
const TAGS = [['revenue', 'Revenue'], ['systems', 'Systems'], ['brand', 'Brand'], ['workload', 'Workload']];
const PHASES = [['plan', 'Plan'], ['evolve', 'Evolve'], ['succeed', 'Succeed']];
const PHASE_VENTURE_SLUG = 'becs';             // P.E.S. phase is only offered for this venture

/* Scopes an app key can be given, with plain-language descriptions for the Keys screen. */
const SCOPE_TABLES = [
  ['tasks', 'Tasks', 'See tasks', 'Add, change and delete tasks'],
  ['clients', 'Clients', 'See clients and their notes', 'Add, change and delete clients'],
  ['projects', 'Projects', 'See projects and their value', 'Add, change and delete projects'],
  ['ventures', 'Ventures', 'See the list of ventures', 'Add, rename or archive ventures']
];
const ALL_READ = SCOPE_TABLES.map(t => t[0] + ':read').concat('activity:read');
const ALL_SCOPES = SCOPE_TABLES.flatMap(t => [t[0] + ':read', t[0] + ':write']).concat('activity:read');

const labelOf = (list, v) => { const hit = list.find(([k]) => String(k) === String(v)); return hit ? hit[1] : (v == null ? '' : String(v)); };

/* =====================================================================
   2  HELPERS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);

/* h(tag, props, ...children) builds an element. Strings always become TEXT,
   never HTML, so nothing from the API can inject markup. Props:
   class, text, on<event> (function), and anything else becomes an attribute
   (set with setAttribute, which never parses HTML). value/checked/disabled/
   selected/hidden/readOnly are set as properties after children are added. */
const PROPS = new Set(['value', 'checked', 'disabled', 'selected', 'hidden', 'readOnly']);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  add(el, kids);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = String(v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (PROPS.has(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  return el;
}
function add(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false || k === '') continue;
    el.append(k instanceof Node ? k : String(k));   // append(string) = text node
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function icon(name) {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', 'ico'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false');
  const u = document.createElementNS(SVGNS, 'use'); u.setAttribute('href', '#i-' + name);
  s.append(u); return s;
}
const opt = (value, text, selected) => h('option', { value: String(value ?? ''), selected: !!selected }, text);

/* Safe storage: private windows can throw, so every access is wrapped. */
function storeGet(kind, k) { try { return (kind === 'session' ? sessionStorage : localStorage).getItem(k); } catch { return null; } }
function storeSet(kind, k, v) { try { const s = kind === 'session' ? sessionStorage : localStorage; v == null ? s.removeItem(k) : s.setItem(k, v); } catch { /* ignore */ } }

/* Dates: the API uses YYYY-MM-DD. "Today" is the user's LOCAL date. */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
function fmtDate(s) {
  if (!s) return '';
  const d = parseDay(s); if (isNaN(d)) return String(s);
  const o = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}
function dayDiff(s) { return Math.round((parseDay(s) - parseDay(today())) / 86400000); }
/* "Due today", "2 days late", "Due tomorrow", "Due Oct 12" */
function dueText(s) {
  if (!s) return '';
  const n = dayDiff(s);
  if (n === 0) return 'Due today';
  if (n === 1) return 'Due tomorrow';
  if (n === -1) return '1 day late';
  if (n < 0) return `${-n} days late`;
  if (n < 7) return `Due ${parseDay(s).toLocaleDateString('en-US', { weekday: 'short' })} ${fmtDate(s)}`;
  return 'Due ' + fmtDate(s);
}
/* Timestamps are UTC text, e.g. "2026-10-04 18:35:00" or ISO. */
function parseTs(s) {
  if (!s) return null;
  const t = String(s);
  const iso = /^\d{4}-\d\d-\d\d[ T]\d\d:\d\d(:\d\d(\.\d+)?)?$/.test(t) ? t.replace(' ', 'T') + 'Z' : t;
  const d = new Date(iso); return isNaN(d) ? null : d;
}
const fmtTs = s => { const d = parseTs(s); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : String(s || ''); };
function timeAgo(s) {
  const d = parseTs(s); if (!d) return s ? String(s) : '';
  const sec = Math.round((Date.now() - d) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
  if (sec < 86400) return Math.floor(sec / 3600) + ' h ago';
  if (sec < 86400 * 7) return Math.floor(sec / 86400) + ' d ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* Money: the API stores integer cents; people see and type dollars. */
function money(cents) {
  if (cents == null || cents === '') return '';
  const c = Number(cents);
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 }).format(c / 100);
}
function moneyShort(cents) {
  const d = Number(cents || 0) / 100;
  if (d >= 1e6) return '$' + (d / 1e6).toFixed(d >= 1e7 ? 0 : 1) + 'M';
  if (d >= 1e4) return '$' + Math.round(d / 1e3) + 'K';
  return money(cents || 0);
}
const centsToInput = c => (c == null || c === '') ? '' : (Number(c) % 100 ? (Number(c) / 100).toFixed(2) : String(Number(c) / 100));
function dollarsToCents(str) {   // returns cents, null for empty, or throws a message
  const s = String(str || '').trim().replace(/[$,\s]/g, '');
  if (!s) return null;
  if (!/^\d+(\.\d{0,2})?$/.test(s)) throw 'Enter an amount in dollars, like 4500 or 4500.50.';
  return Math.round(parseFloat(s) * 100);
}
const prioLabel = p => labelOf(PRIORITIES, p) || 'Low';
const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' });

/* =====================================================================
   3  API LAYER. Every request goes through api(). Success returns the
   "data" part of {"data": ...}. Failure throws ApiError with the server's
   status, error code, plain message and per-field problems.
   ===================================================================== */
class ApiError extends Error {
  constructor(status, code, message, fields) { super(message); this.status = status; this.code = code; this.fields = fields || null; }
}
const FALLBACK_MESSAGES = {
  0: 'Can\u2019t reach BECS OS. Check your connection, then try again.',
  400: 'The server did not accept that. Check the fields and try again.',
  401: 'You are not signed in.',
  403: 'This key is not allowed to do that.',
  404: 'That record no longer exists. It may have been deleted.',
  405: 'That action is not supported.',
  409: 'That can\u2019t be done because other records still point at this one.',
  429: 'Too many requests from this key. Wait a minute, then try again.',
  500: 'The server hit a problem. Try again in a moment.'
};
function qs(params) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) if (v !== null && v !== undefined && v !== '') p.set(k, String(v));
  const s = p.toString(); return s ? '?' + s : '';
}
async function api(method, path, body) {
  const headers = { Accept: 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const key = storeGet('session', STORE_KEY);
  if (key) headers.Authorization = 'Bearer ' + key;
  let res;
  try {
    res = await fetch(API_BASE + path, { method, headers, credentials: 'same-origin', cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body) });
  } catch {
    throw new ApiError(0, 'network', FALLBACK_MESSAGES[0]);
  }
  let json = null;
  try { json = await res.json(); } catch { /* not JSON */ }
  if (res.ok) return json && typeof json === 'object' && 'data' in json ? json.data : json;
  const code = (json && json.error) || 'http_' + res.status;
  let msg = (json && typeof json.message === 'string' && json.message) || FALLBACK_MESSAGES[res.status] || `Request failed (${res.status}).`;

/* GET helpers for screens. need() = the screen cannot work without it.
   maybe() = nice to have; returns null when not allowed or failing. */
const need = (path, params) => api('GET', path + qs(params));
async function maybe(path, params, scope) {
  if (scope && !can(scope)) return null;
  try { return await api('GET', path + qs(params)); } catch (e) { if (e.status === 401) throw e; return null; }
}

/* Read a WHOLE list, not just its first 500 rows. The API sends at most
   500 rows per request, so ask again with ?offset=500, 1000, ... until a page
   comes back short. Stops at LIST_CEILING rows. Returns the rows as an array;
   if the list is longer than the ceiling, the array gets .partial = true so
   the screen can say so (see partialNotice). A row seen twice (one was added
   while paging) is kept once. */
async function fetchAll(path, params) {
  const rows = [], seen = new Set();
  for (let offset = 0; offset < LIST_CEILING; offset += LIST_PAGE) {
    const page = (await api('GET', path + qs({ ...params, limit: LIST_PAGE, offset }))) || [];
    for (const r of page) if (!seen.has(r.id)) { seen.add(r.id); rows.push(r); }
    if (page.length < LIST_PAGE) return rows;
  }
  /* Exactly at the ceiling: one tiny request tells us whether anything is left. */
  const more = (await api('GET', path + qs({ ...params, limit: 1, offset: LIST_CEILING }))) || [];
  if (more.length) rows.partial = true;
  return rows;
}
/* Same as need() / maybe(), but reading the whole list. */
const needAll = (path, params) => fetchAll(path, params);
async function maybeAll(path, params, scope) {
  if (scope && !can(scope)) return null;
  try { return await fetchAll(path, params); } catch (e) { if (e.status === 401) throw e; return null; }
}

/* =====================================================================
   4  SIGN-IN. GET /api/me with the browser's cookies (Cloudflare Access).
   200 = in. 401 = show the key box; the key lives in sessionStorage only.
   ===================================================================== */
const SESSION = { me: null, mode: null };   // mode: 'key' | 'access'
const can = scope => !!SESSION.me && (SESSION.me.kind !== 'app' || (SESSION.me.scopes || []).includes(scope));
const isAdmin = () => !!SESSION.me && (SESSION.me.kind === 'master' || SESSION.me.kind === 'user');

function gate(state, msg) {
  $('#shell').hidden = true; $('#gate').hidden = false;
  closeDialogs();
  const title = { checking: 'Checking sign-in', key: 'Unlock', down: 'Can\u2019t reach BECS OS', expired: 'Signed out' }[state];
  $('#gateTitle').textContent = title;
  $('#gateMsg').textContent = msg;
  $('#keyForm').hidden = state !== 'key';
  $('#gateRetry').hidden = !(state === 'down' || state === 'expired');
  $('#retryBtn').textContent = state === 'expired' ? 'Reload and sign in' : 'Try again';
  $('#retryBtn').onclick = state === 'expired' ? () => location.reload() : boot;
  if (state === 'key') { $('#keyErr').textContent = ''; $('#keyInput').value = ''; $('#keyInput').focus(); }
  else if (state !== 'checking') $('#retryBtn').focus();
}

async function boot() {
  gate('checking', 'One moment.');
  const hadKey = !!storeGet('session', STORE_KEY);
  try {
    SESSION.me = await api('GET', '/me');
    SESSION.mode = hadKey ? 'key' : 'access';
    await enterApp();
  } catch (e) {
    if (e.status === 401) {
      storeSet('session', STORE_KEY, null);
      gate('key', hadKey ? 'Your saved key was not accepted. Enter it again.' : 'Enter your access key to open the console.');
      if (hadKey) $('#keyErr').textContent = 'That key was not accepted.';
    } else {
      gate('down', e.message + (e.status ? ` (error ${e.status})` : ''));
    }
  }
}

$('#keyForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const key = $('#keyInput').value.trim();
  const err = $('#keyErr'), btn = $('#keyBtn');
  if (!key) { err.textContent = 'Paste your key first.'; $('#keyInput').setAttribute('aria-invalid', 'true'); return; }
  btn.disabled = true; err.textContent = '';
  storeSet('session', STORE_KEY, key);
  try {
    SESSION.me = await api('GET', '/me');
    SESSION.mode = 'key';
    $('#keyInput').value = '';
    $('#keyInput').removeAttribute('aria-invalid');
    await enterApp();
  } catch (e) {
    storeSet('session', STORE_KEY, null);
    err.textContent = e.status === 401 ? 'That key was not accepted. Check it and try again.' : e.message;
    $('#keyInput').setAttribute('aria-invalid', 'true');
    $('#keyInput').focus();
  } finally { btn.disabled = false; }
});

/* Remove everything the last session loaded from the page, so a locked or
   signed-out console does not keep client data in the (hidden) page. */
function clearScreen() {
  renderToken++;                    // stop any screen that is still loading
  cache = null; current = null;
  $('#app').replaceChildren();
}

let lostOnce = false;
function sessionLost() {            // a 401 in the middle of using the app
  if (lostOnce) return; lostOnce = true;
  clearScreen();
  if (SESSION.mode === 'key') {
    storeSet('session', STORE_KEY, null);
    gate('key', 'The key stopped working (it may have been revoked). Enter a key to continue.');
  } else {
    gate('expired', 'Your sign-in has expired. Reload to sign in again.');
  }
  SESSION.me = null;
}
function lock() {
  storeSet('session', STORE_KEY, null);
  SESSION.me = null; clearScreen();
  gate('key', 'Locked. Enter your key to open the console again.');
}

function drawWho() {
  const me = SESSION.me;
  const text = me.kind === 'master' ? 'Master key' : me.kind === 'user' ? (me.email || 'Signed in') : `App: ${me.app || 'unknown'}`;
  $('#whoText').textContent = text;
  $('#whoText').title = me.kind === 'app' ? 'Scopes: ' + (me.scopes || []).join(', ') : text;
  const slot = $('#whoAction');
  slot.replaceChildren(SESSION.mode === 'key'
    ? h('button', { class: 'btn sm', type: 'button', onclick: lock, title: 'Forget the key in this tab' }, icon('lock'), 'Lock')
    : h('a', { class: 'btn sm', href: '/cdn-cgi/access/logout' }, icon('out'), 'Sign out'));
}

async function enterApp() {
  lostOnce = false;
  await loadVentures();
  drawWho();
  $('#navKeys').hidden = !isAdmin();
  $('#gate').hidden = true; $('#shell').hidden = false;
  route();
}

/* =====================================================================
   5  VENTURES AND THE SWITCHER
   ===================================================================== */
let VENTURES = [];   // [{id, slug, name, status, ...}]
async function loadVentures() {
  VENTURES = [];
  if (can('ventures:read')) {
    try { VENTURES = await fetchAll('/ventures'); } catch (e) { if (e.status === 401) throw e; }
  }
  VENTURES.sort((a, b) => (a.status === 'archived') - (b.status === 'archived') || byName(a, b));
  const saved = storeGet('local', STORE_VENTURE) || '';
  if (saved && !VENTURES.some(v => String(v.id) === saved)) storeSet('local', STORE_VENTURE, null);
  drawVenturePicker();
}
const ventureById = id => VENTURES.find(v => String(v.id) === String(id));
const ventureName = id => (ventureById(id) || {}).name || (id ? 'Venture ' + id : '');
const ventureSlug = id => (ventureById(id) || {}).slug || '';
const selectedVenture = () => storeGet('local', STORE_VENTURE) || '';     // '' = all
const ventureParam = () => ({ venture_id: selectedVenture() || null });
function defaultVenture() {
  /* Fallback: the oldest active venture (id 1, BECS), not the first one alphabetically. */
  const first = VENTURES.filter(v => v.status !== 'archived').sort((a, b) => a.id - b.id)[0];
  return selectedVenture() || storeGet('local', STORE_LAST_VENTURE) || (first || {}).id || '';
}
function setVenture(id) {
  storeSet('local', STORE_VENTURE, id ? String(id) : null);
  $('#ventureSel').value = id ? String(id) : '';
  route();
}
function drawVenturePicker() {
  const sel = $('#ventureSel'), cur = selectedVenture();
  sel.replaceChildren(opt('', 'All ventures', !cur),
    ...VENTURES.map(v => opt(v.id, v.name + (v.status && v.status !== 'active' ? ` (${v.status})` : ''))));
  sel.value = cur;
  sel.closest('.vpick').hidden = !VENTURES.length;
}
$('#ventureSel').addEventListener('change', e => setVenture(e.target.value));
/* Small dark tag naming the venture, shown on rows when "All ventures" is selected. */
const ventTag = id => !selectedVenture() && id ? h('span', { class: 'pill vent', title: ventureName(id) }, ventureSlug(id) || ('#' + id)) : null;

/* =====================================================================
   6  SHARED PIECES: toast, confirm box, notices, write()
   ===================================================================== */
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('bad', !!bad); t.setAttribute('role', bad ? 'alert' : 'status');
  t.classList.add('show'); clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), bad ? 6000 : 2600);
}

/* Remember what had focus before a dialog opened, and go back to it after. */
function openModal(dlg, focusEl) {
  const back = document.activeElement;
  dlg.addEventListener('close', () => {
    if (dlg.id === 'dlg') dlg.replaceChildren();
    const fk = back && back.dataset && back.dataset.fk;
    const target = (back && back.isConnected) ? back : (fk && document.querySelector(`[data-fk="${CSS.escape(fk)}"]`)) || $('#app');
    if (!$('#shell').hidden) target.focus();
  }, { once: true });
  dlg.showModal();
  (focusEl || dlg.querySelector('input,select,textarea,button')).focus();
}
function closeDialogs() { for (const d of document.querySelectorAll('dialog[open]')) d.close(); }

/* confirmBox({title, body, ok}) resolves true when confirmed. Escape or Cancel = false. */
function confirmBox({ title, body, ok = 'Delete', danger = true }) {
  return new Promise(resolve => {
    const dlg = $('#confirmDlg');
    const cancel = h('button', { class: 'btn', type: 'button', onclick: () => dlg.close('no') }, 'Cancel');
    const yes = h('button', { class: 'btn ' + (danger ? 'danger' : 'solid'), type: 'button', onclick: () => dlg.close('yes') }, ok);
    dlg.replaceChildren(h('div', { class: 'dform' },
      h('div', {}, h('div', { class: 'eyebrow' }, 'Please confirm'), h('h2', { class: 'h2', id: 'confirmTitle', style: 'margin-top:4px' }, title), h('div', { class: 'lime-rule' })),
      h('p', {}, body),
      h('div', { class: 'dfoot' }, h('div', { class: 'right' }, cancel, yes))));
    dlg.returnValue = '';
    dlg.addEventListener('close', () => resolve(dlg.returnValue === 'yes'), { once: true });
    openModal(dlg, cancel);
  });
}

/* A notice panel used for "not allowed", "could not load" and similar. */
function notice(title, text, { retry, err = true } = {}) {
  return h('div', { class: 'notice' + (err ? ' err' : ''), role: err ? 'alert' : null },
    h('b', {}, title), h('span', { class: 'small' }, text),
    retry ? h('div', { class: 'actions' }, h('button', { class: 'btn sm', type: 'button', onclick: retry }, icon('retry'), 'Try again')) : null);
}
function errorNotice(e, what, scope) {
  if (e.status === 403 && e.code !== 'bad_origin') {
    return notice(`This key can\u2019t see ${what}`, scope ? `It needs the "${scope}" scope. Ask for a key with that scope, or sign in as the owner.` : e.message, { err: false });
  }
  return notice(`Couldn\u2019t load ${what}`, e.message + (e.status ? ` (error ${e.status})` : ''), { retry: () => route() });
}
/* Shown at the top of a screen when a list was longer than the console loads
   (LIST_CEILING rows), so nothing goes missing silently.
   lists: [['tasks', rows], ['projects', rows]]; rows may be null. */
function partialNotice(lists) {
  const cut = lists.filter(([, rows]) => rows && rows.partial).map(([name]) => name);
  if (!cut.length) return null;
  const n = LIST_CEILING.toLocaleString('en-US');
  return notice(`Showing the newest ${n} ${cut.join(' and ')} only`,
    `There are more than ${n}, so older ones are not loaded on this screen and counts here may be low. Pick one venture at the top of the page to see fewer at a time.`,
    { err: false });
}

/* Run one write (POST/PATCH/DELETE), then refetch the current screen.
   The control that started it is disabled while the request is in flight. */
async function write(method, path, body, okMsg, control, toastErrors = true) {
  if (control) control.disabled = true;
  try {
    const out = await api(method, path, body);
    RELATED.clear();
    if (okMsg) toast(okMsg);
    await refresh();
    return out;
  } catch (e) {
    if (e.status !== 401 && toastErrors) toast(e.message, true);
    throw e;
  } finally {
    if (control && control.isConnected) control.disabled = false;   // only matters if the refresh did not replace it
  }
}
const quiet = p => p.catch(() => {});   // for click handlers: errors were already shown

/* Option lists for related pickers (a venture's clients / projects), cached until the next write. */
const RELATED = new Map();
async function related(table, ventureId) {
  if (!ventureId || !can(table + ':read')) return null;
  const k = table + ':' + ventureId;
  if (!RELATED.has(k)) RELATED.set(k, fetchAll(`/${table}`, { venture_id: ventureId }).then(r => r.sort(byName)).catch(e => { RELATED.delete(k); return null; }));
  return RELATED.get(k);
}

/* =====================================================================
   7  THE FORM DIALOG (used for every create and edit)
   fields: [{ name, label, kind, required, max, options, hint, full,
              showIf(values), hiddenValue(values), relatedTo }]
   kind: text | email | tel | textarea | date | money | select | venture | related
   - On create, empty optional fields are left out.
   - On edit, only fields that changed are sent (PATCH).
   - Server "fields" errors are shown under the matching input.
   ===================================================================== */
function formDialog({ eyebrow, title, fields, row, preset = {}, submitLabel, onSubmit, onDelete, stamp }) {
  const dlg = $('#dlg');
  const inputs = {}, wraps = {}, errs = {};
  const general = h('div', { class: 'derr', role: 'alert' });
  const grid = h('div', { class: 'fgrid' });
  const initial = f => row ? row[f.name] : (preset[f.name] !== undefined ? preset[f.name] : f.default);

  for (const f of fields) {
    const id = 'f-' + f.name, errId = id + '-err', hintId = id + '-hint';
    let input;
    if (f.kind === 'textarea') input = h('textarea', { id, name: f.name, maxlength: f.max, rows: 4 });
    else if (f.kind === 'select' || f.kind === 'related' || (f.kind === 'venture' && VENTURES.length)) input = h('select', { id, name: f.name });
    else if (f.kind === 'venture') input = h('input', { id, name: f.name, type: 'number', min: 1, inputmode: 'numeric' });
    else input = h('input', { id, name: f.name, type: { email: 'email', tel: 'tel', date: 'date' }[f.kind] || 'text', maxlength: f.max, inputmode: f.kind === 'money' ? 'decimal' : null, autocomplete: 'off', spellcheck: f.kind === 'text' ? 'true' : 'false' });
    input.setAttribute('aria-describedby', (f.hint ? hintId + ' ' : '') + errId);
    if (f.required) input.setAttribute('aria-required', 'true');

    const v = initial(f);
    if (f.kind === 'select') { input.append(...f.options.map(([k, l]) => opt(k, l))); input.value = v == null ? '' : String(v); }
    else if (f.kind === 'venture' && VENTURES.length) {
      input.append(opt('', 'Choose a venture'), ...VENTURES.map(x => opt(x.id, x.name + (x.status === 'archived' ? ' (archived)' : ''))));
      input.value = v == null ? '' : String(v);
    }
    else if (f.kind === 'related') { input.dataset.want = v == null ? '' : String(v); }
    else if (f.kind === 'money') input.value = centsToInput(v);
    else input.value = v == null ? '' : String(v);

    errs[f.name] = h('span', { class: 'ferr', id: errId });
    inputs[f.name] = input;
    wraps[f.name] = h('div', { class: 'field' + (f.full ? ' full' : '') },
      h('div', { class: 'lbl' }, h('label', { for: id }, f.label), f.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null),
      input, f.hint ? h('span', { class: 'hint', id: hintId }, f.hint) : null, errs[f.name]);
    grid.append(wraps[f.name]);
  }

  const values = () => Object.fromEntries(fields.map(f => [f.name, inputs[f.name].value]));
  /* Show/hide conditional fields and refill pickers that depend on the venture. */
  async function sync(changed) {
    const vals = values();
    for (const f of fields) if (f.showIf) wraps[f.name].hidden = !f.showIf(vals);
    for (const f of fields) {
      if (f.kind !== 'related' || (changed && changed !== f.relatedTo && changed !== 'init')) continue;
      const sel = inputs[f.name], want = changed === 'init' ? sel.dataset.want : sel.value;
      sel.disabled = true; sel.replaceChildren(opt('', 'Loading\u2026'));
      const list = await f.options(vals);
      sel.replaceChildren(opt('', f.none || 'None'));
      if (list === null) {
        wraps[f.name].hidden = !want;   // not readable: only keep the current value
        if (want) sel.append(opt(want, `Current (#${want})`));
      } else {
        wraps[f.name].hidden = false;
        sel.append(...list.map(x => opt(x.id, x.name || x.title)));
        if (want && !list.some(x => String(x.id) === want) && changed === 'init') sel.append(opt(want, `#${want} (other venture)`));
      }
      sel.value = want && [...sel.options].some(o => o.value === want) ? want : '';
      sel.disabled = false;
    }
  }
  for (const f of fields) if (f.kind === 'venture' || f.kind === 'select') inputs[f.name].addEventListener('change', () => sync(f.name));

  function clearErrors() {
    general.textContent = '';
    for (const f of fields) { errs[f.name].textContent = ''; inputs[f.name].removeAttribute('aria-invalid'); }
  }
  function showErrors(map, msg) {
    let first = null; const extra = [];
    for (const [k, problem] of Object.entries(map || {})) {
      if (inputs[k] && !wraps[k].hidden) { errs[k].textContent = String(problem); inputs[k].setAttribute('aria-invalid', 'true'); first = first || inputs[k]; }
      else extra.push(`${k}: ${problem}`);
    }
    general.textContent = [msg, ...extra].filter(Boolean).join(' ');
    (first || general).focus?.();
  }

  /* Turn the inputs into the JSON body. Throws {fields} for local problems. */
  function collect() {
    const out = {}, problems = {};
    const vals = values();
    for (const f of fields) {
      const hidden = wraps[f.name].hidden;
      if (hidden) {
        const hv = f.hiddenValue ? f.hiddenValue(vals) : undefined;
        if (hv !== undefined) out[f.name] = hv;
        continue;
      }
      const raw = inputs[f.name].value.trim();
      let val;
      if (f.kind === 'money') { try { val = dollarsToCents(raw); } catch (m) { problems[f.name] = m; continue; } }
      else if (f.numeric || f.kind === 'venture' || f.kind === 'related') val = raw === '' ? null : Number(raw);
      else val = raw === '' ? null : raw;
      if (f.required && val === null) { problems[f.name] = 'Required.'; continue; }
      if (f.kind === 'email' && val && !val.includes('@')) { problems[f.name] = 'Must contain @.'; continue; }
      out[f.name] = val;
    }
    if (Object.keys(problems).length) throw { fields: problems };
    if (!row) { for (const k of Object.keys(out)) if (out[k] === null && !fields.find(f => f.name === k).sendNull) delete out[k]; return out; }
    const diff = {};
    for (const [k, v] of Object.entries(out)) if (String(v ?? '') !== String(row[k] ?? '')) diff[k] = v;
    return diff;
  }

  const save = h('button', { class: 'btn primary', type: 'submit' }, submitLabel);
  const cancel = h('button', { class: 'btn', type: 'button', onclick: () => dlg.close() }, 'Cancel');
  const del = onDelete ? h('button', { class: 'btn danger', type: 'button' }, 'Delete') : null;
  const form = h('form', { class: 'dform', novalidate: true },
    h('div', { class: 'dhead' }, h('div', {}, h('div', { class: 'eyebrow' }, eyebrow), h('h2', { class: 'h2', id: 'dlgTitle', tabindex: '-1', style: 'margin-top:4px;outline:none' }, title), h('div', { class: 'lime-rule' }))),
    grid, general,
    stamp ? h('div', { class: 'stamp' }, stamp) : null,
    h('div', { class: 'dfoot' }, del, h('div', { class: 'right' }, cancel, save)));

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (save.disabled) return;
    clearErrors();
    let body;
    try { body = collect(); } catch (p) { showErrors(p.fields, 'Please fix the highlighted fields.'); return; }
    if (row && !Object.keys(body).length) { dlg.close(); toast('No changes to save.'); return; }
    save.disabled = true; if (del) del.disabled = true;
    const label = save.textContent; save.textContent = 'Saving\u2026';
    try {
      if (body.venture_id) storeSet('local', STORE_LAST_VENTURE, String(body.venture_id));
      await onSubmit(body);
      dlg.close();
    } catch (e) {
      if (e.status === 401) return;
      showErrors(e.fields, e.message);
    } finally { save.disabled = false; save.textContent = label; if (del) del.disabled = false; }
  });
  if (del) del.addEventListener('click', async () => {
    clearErrors();
    const yes = await confirmBox(onDelete.confirm);
    if (!yes) { del.focus(); return; }
    del.disabled = true; save.disabled = true;
    try { await onDelete.run(); dlg.close(); }
    catch (e) { if (e.status !== 401) { general.textContent = e.message; del.focus(); } }
    finally { del.disabled = false; save.disabled = false; }
  });

  dlg.replaceChildren(form);
  sync('init');
  /* On touch screens an edit form opens on its title instead of the first input,
     so the keyboard does not pop up and cover the record you only wanted to look at. */
  const touchEdit = row && window.matchMedia('(pointer: coarse)').matches;
  openModal(dlg, touchEdit ? $('#dlgTitle', dlg) : inputs[fields.find(f => f.focus)?.name] || null);
}

/* =====================================================================
   8  RECORD FORMS
   ===================================================================== */
const stampOf = r => r ? `Created ${timeAgo(r.created_at)} \u00b7 Updated ${timeAgo(r.updated_at)}` + (r.completed_at ? ` \u00b7 Completed ${timeAgo(r.completed_at)}` : '') + ` \u00b7 #${r.id}` : null;

/* Open an edit form for a record we only have an id for (fetches it fresh). */
async function editById(table, id, control) {
  if (control) control.disabled = true;
  try {
    const row = await api('GET', `/${table}/${id}`);
    ({ clients: clientForm, projects: projectForm, tasks: taskForm })[table](row);
  } catch (e) { if (e.status !== 401) toast(e.message, true); }
  finally { if (control && control.isConnected) control.disabled = false; }
}

/* Activity feed. Each log row (SPEC "activity_log") has entity_type (the table
   name, e.g. "tasks"), entity_id, action (created / updated / deleted), detail
   (a JSON string: the fields set, the fields changed, or the deleted row) and
   actor ("master", "user:<email>" or "app:<name>"). */
const ACTIVITY_SHOWN = 12;     // rows shown on the Overview
const ACTIVITY_FETCH = 50;     // rows fetched, so updates can borrow a name from an earlier row
const ENTITY = { tasks: 'Task', clients: 'Client', projects: 'Project', ventures: 'Venture' };
const VENTURE_STATUSES = [['active', 'Active'], ['paused', 'Paused'], ['archived', 'Archived']];
const parseDetail = a => {
  if (a.detail && typeof a.detail === 'object') return a.detail;
  try { const d = JSON.parse(a.detail); return d && typeof d === 'object' ? d : {}; } catch { return {}; }
};
const short = (s, n = 60) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; };
/* One changed field in plain words, e.g. "marked done", "stage: Proposal", "due Oct 12". */
function changeWords(type, k, v) {
  const none = v == null || v === '';
  switch (k) {
    case 'status':
      if (type === 'tasks') return v === 'done' ? 'marked done' : 'status: ' + labelOf(TASK_STATUSES, v);
      return 'status: ' + labelOf(type === 'projects' ? PROJECT_STATUSES : VENTURE_STATUSES, v);
    case 'stage': return 'stage: ' + labelOf(STAGES, v);
    case 'phase': return none ? 'phase cleared' : 'phase: ' + labelOf(PHASES, v);
    case 'priority': return 'priority: ' + prioLabel(v);
    case 'filter_tag': return none ? 'tag cleared' : 'tag: ' + labelOf(TAGS, v);
    case 'due_date': return none ? 'due date cleared' : 'due ' + fmtDate(v);
    case 'start_date': return none ? 'start date cleared' : 'starts ' + fmtDate(v);
    case 'value_cents': return none ? 'value cleared' : 'value: ' + money(v);
    case 'venture_id': return 'moved to ' + ventureName(v);
    case 'client_id': return none ? 'client removed' : 'client changed';
    case 'project_id': return none ? 'project removed' : 'project changed';
    case 'title': case 'name': return 'renamed';
    case 'notes': case 'description': return 'notes edited';
    case 'contact_name': return 'contact changed';
    default: return k.replace(/_/g, ' ') + ' changed';
  }
}
const actorWords = s => !s ? '' : s === 'master' ? 'by master key' : s.startsWith('app:') ? 'by app ' + s.slice(4) : s.startsWith('user:') ? 'by ' + s.slice(5) : 'by ' + s;
function activityBlock(rows) {
  if (rows === null) return null;   // no permission: hide quietly
  /* Updates only carry the changed fields, so look for the record's name in other rows (newest first). */
  const names = new Map();
  for (const a of rows) {
    const d = parseDetail(a), n = d.title || d.name, k = a.entity_type + ':' + a.entity_id;
    if (n && !names.has(k)) names.set(k, String(n));
  }
  const item = a => {
    const d = parseDetail(a);
    const name = names.get(a.entity_type + ':' + a.entity_id);
    const kind = ENTITY[a.entity_type] || String(a.entity_type || 'Record');
    const changes = a.action === 'updated'
      ? Object.entries(d).filter(([k]) => !['id', 'created_at', 'updated_at', 'completed_at'].includes(k)).map(([k, v]) => changeWords(a.entity_type, k, v))
      : [];
    const vId = a.action !== 'updated' ? d.venture_id : null;
    return h('li', {}, h('div', { class: 'grow' },
      h('div', { class: 'small' }, h('b', {}, kind + ' ' + (a.action || 'changed')), ': ', name ? short(name) : '#' + (a.entity_id ?? '?')),
      h('div', { class: 'meta' }, [changes.join(', '), vId && !selectedVenture() ? ventureName(vId) : '', timeAgo(a.created_at), actorWords(a.actor)].filter(Boolean).join(' \u00b7 '))));
  };
  const shown = rows.slice(0, ACTIVITY_SHOWN);
  return h('section', { class: 'block' }, h('h2', { class: 'h2' }, 'Recent activity', h('span', { class: 'mono' }, 'all ventures')),
    h('div', { class: 'panel' }, shown.length ? h('ul', { class: 'rows' }, shown.map(item)) : h('div', { class: 'empty' }, h('b', {}, 'No activity yet.'))));
}

/* ---------- 9c Projects ---------- */
const projectsScreen = {
  title: 'Projects', status: 'current',
  async load() {
    const v = ventureParam();
    /* All tasks are read too: the progress bars count done tasks per project. */
    const [projects, clients, tasks] = await Promise.all([
      needAll('/projects', v),
      maybeAll('/clients', v, 'clients:read'),
      maybeAll('/tasks', v, 'tasks:read')]);
    return { projects, clients, tasks };
  },
  draw(data) {
    const me = projectsScreen, writable = can('projects:write');
    const CURRENT = ['planning', 'active', 'paused'];
    const filters = [['current', 'Current'], ...PROJECT_STATUSES, ['all', 'All']];
